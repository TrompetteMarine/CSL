name: Replication smoke checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Verified against the official release tags; pinned to immutable commits.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compiler availability
        run: g++ --version
      - name: Source, archive safety, Lean record identity and dense-equation checks
        run: make check
      # This job neither downloads the large population arrays nor reruns the
      # full study. A fresh Lean kernel build is a separate make verify-lean task.
