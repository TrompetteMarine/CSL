name: Publish verified CSL replication code
on:
  push:
    branches: [replication-release-20261018]
    paths: [replication_transport_manifest.json]
permissions:
  contents: write
concurrency:
  group: csl-replication-publication
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'TrompetteMarine/CSL' && github.ref == 'refs/heads/replication-release-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out unchanged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Verify transport and publish source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import urllib.request
          import zipfile
          
          REPO = 'TrompetteMarine/CSL'
          BASE = 'f186e221aaaf5ebf520f51d2be3858aeb3887b6b'
          ARCHIVE_SHA = '78833edfd26b85ee3cc7efc2e1d87458068f153a8673e7f1703e09c6ac581c7c'
          ARCHIVE_BYTES = 17452300
          PREFIX = 'nhb_replication/2026-10-16/'
          SKIP = '.github/workflows/nhb-replication.yml'
          TOKEN = os.environ['GH_TOKEN']
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/replication-release-20261018'
          
          def api(path, raw=False):
              req = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + path,
                  headers={'Authorization': 'Bearer ' + TOKEN,
                           'Accept': 'application/vnd.github.raw+json' if raw else 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  body = response.read()
                  content_type = response.headers.get('Content-Type', '')
              if raw and body.lstrip().startswith(b'{'):
                  try:
                      data = json.loads(body)
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      data = None
                  if isinstance(data, dict) and data.get('encoding') == 'base64' and 'content' in data:
                      return base64.b64decode(data['content'])
              return body if raw else json.loads(body)
          
          manifest = api('contents/replication_transport_manifest.json?ref=' + os.environ['GITHUB_SHA'])
          assert manifest['encoding'] == 'base64'
          manifest = json.loads(base64.b64decode(manifest['content']))
          assert manifest['mode'] == 'code-bootstrap'
          assert manifest['repository'] == REPO and manifest['base'] == BASE
          assert manifest['archive_sha256'] == ARCHIVE_SHA and manifest['archive_bytes'] == ARCHIVE_BYTES
          assert len(manifest['parts']) == 30
          assert api('git/ref/heads/main')['object']['sha'] == BASE
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == BASE
          
          archive = io.BytesIO()
          for index, part in enumerate(manifest['parts']):
              assert part['index'] == index
              assert re.fullmatch(r'[0-9a-f]{40}', part['git_sha'])
              assert 0 < part['bytes'] <= 600000
              data = api('git/blobs/' + part['git_sha'], raw=True)
              assert len(data) == part['bytes']
              assert hashlib.sha256(data).hexdigest() == part['sha256']
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == part['git_sha']
              archive.write(data)
              print('Verified code transport part', index + 1, 'of', len(manifest['parts']), flush=True)
          assert archive.tell() == ARCHIVE_BYTES
          assert hashlib.sha256(archive.getvalue()).hexdigest() == ARCHIVE_SHA
          
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
              receipt = json.loads(bundle.read('PUBLICATION_RECEIPT.json'))
              expected = receipt['prepared_files_git_sha1']
              assert len(expected) == 333
              assert set(bundle.namelist()) == set(expected) | {'PUBLICATION_RECEIPT.json', 'README_PUSH_CSL.md'}
              assert len(bundle.namelist()) == 335
              for name, git_sha in expected.items():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and str(path) == name
                  assert name in {'README.md', 'LEGACY_README.md', SKIP} or name.startswith(PREFIX)
                  info = bundle.getinfo(name)
                  assert not stat.S_ISLNK(info.external_attr >> 16)
                  data = bundle.read(name)
                  assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == git_sha
              source_manifest = json.loads(bundle.read(PREFIX + 'replication/source_manifest.json'))
              assert len(source_manifest['files']) == 329
              for item in source_manifest['files']:
                  data = bundle.read(PREFIX + item['path'])
                  assert len(data) == item['bytes']
                  assert hashlib.sha256(data).hexdigest() == item['sha256']
              for name in expected:
                  if name == SKIP:
                      continue
                  path = Path(name)
                  if any(parent.is_symlink() for parent in path.parents) or path.is_symlink():
                      raise RuntimeError('Refusing existing symlink destination')
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(bundle.read(name))
          
          for key, value in [('user.name', 'github-actions[bot]'),
                             ('user.email', '41898282+github-actions[bot]@users.noreply.github.com'),
                             ('core.autocrlf', 'false'), ('core.safecrlf', 'false')]:
              subprocess.run(['git', 'config', key, value], check=True)
          subprocess.run(['git', 'add', '--', 'README.md', 'LEGACY_README.md', PREFIX.rstrip('/')], check=True)
          index = subprocess.check_output(['git', 'ls-files', '--stage', '-z']).split(b'\0')
          indexed = {}
          for record in index:
              if record:
                  metadata, name = record.split(b'\t', 1)
                  mode, sha, stage = metadata.split()
                  indexed[name.decode()] = sha.decode()
          for name, sha in expected.items():
              if name != SKIP:
                  assert indexed[name] == sha, 'Git index altered bytes for ' + name
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0'))
          assert staged <= set(expected) - {SKIP}
          assert api('git/ref/heads/main')['object']['sha'] == BASE
          subprocess.run(['git', 'commit', '-m', 'Add verified decision-generated credibility replication snapshot'], check=True)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/main'], check=True)
          assert api('git/ref/heads/main')['object']['sha'] == commit
          print('Published verified code commit: ' + commit, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Verified and published 332 source files. Code commit: `' + commit + '`.\n')
              out.write('The root CI workflow is intentionally installed separately through the connected GitHub app.\n')
          
          PY
